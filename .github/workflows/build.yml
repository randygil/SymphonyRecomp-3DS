name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    # needs the private BlackLabelHQ/SymphonyDiscSource repository
    if: github.repository_owner == 'BlackLabelHQ'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SymphonyRecomp
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Checkout disc source
        uses: actions/checkout@v4
        with:
          repository: BlackLabelHQ/SymphonyDiscSource
          token: ${{ secrets.DISC_SOURCE_PAT }}
          path: disc
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build recompiler
        run: dotnet build RecompOne/RecompOne.Recompiler/RecompOne.Recompiler.csproj -c Release

      - name: Run recompilation
        run: dotnet run --project RecompOne/RecompOne.Recompiler -c Release --no-build -- config/sotn.json

      - name: Build SymphonyRecomp
        run: dotnet build RecompOne.SoTN.csproj -c Release -p:NoWarn=0162

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: symphony-recomp-build
          path: bin/Release/net10.0/
